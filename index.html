          bottom: material(COLORS.leftTop)
        });
        addQuad(group, [v(x0 + w * 0.05, objectY1 + 0.004, z0 + d * 0.08), v(x1 - w * 0.05, objectY1 + 0.004, z0 + d * 0.08), v(x1 - w * 0.12, objectY1 + 0.004, z1 - d * 0.12), v(x0 + w * 0.12, objectY1 + 0.004, z1 - d * 0.12)], material(0xffffff, 0.18));
        addSegments(
          group,
          [
            [v(x0, objectY0, z1), v(x1, objectY0, z1)],
            [v(x0, objectY1, z1), v(x1, objectY1, z1)],
            [v(x0, objectY0, z1), v(x0, objectY1, z1)],
            [v(x1, objectY0, z1), v(x1, objectY1, z1)],
            [v(x0, objectY0, z0), v(x0, objectY1, z0)],
            [v(x1, objectY0, z0), v(x1, objectY1, z0)],
            [v(x0, objectY0, z0), v(x1, objectY0, z0)],
            [v(x0, objectY0, z1), v(x0, objectY0, z0)],
            [v(x1, objectY0, z1), v(x1, objectY0, z0)],
            [v(x1, objectY1, z1), v(x1, objectY1, z0)],
            [v(x0, objectY1, z1), v(x0, objectY1, z0)],
            [v(x0, objectY1, z0), v(x1, objectY1, z0)],
          ],
          lineMaterials.edge
        );

        const sideView = Math.abs(state.cameraYaw) >= 8;
        if (sideView) {
          const sideSign = state.cameraYaw >= 0 ? 1 : -1;
          const sideX = sideSign > 0 ? x1 + 0.18 : x0 - 0.18;
          const sideTick = sideSign > 0 ? vectorX : vectorX.clone().multiplyScalar(-1);
          const sideDimensionZ = z0 + 0.06;
          addDimension(group, v(x0, objectY0, z1 + 0.16), v(x1, objectY0, z1 + 0.16), vectorZ, 0.14);
          addDimension(group, v(sideX, objectY0, sideDimensionZ), v(sideX, objectY0, z1 + 0.06), sideTick, 0.14);
          addDimension(group, v(sideX, objectY0, sideDimensionZ), v(sideX, objectY1, sideDimensionZ), sideTick, 0.12);
        } else {
          addDimension(group, v(x0, objectY1 + 0.16, z0 - d * 0.08), v(x1, objectY1 + 0.16, z0 - d * 0.08), vectorY, 0.14);
          addDimension(group, v(x0 - 0.18, objectY1 + 0.025, z0), v(x0 - 0.18, objectY1 + 0.025, z1), vectorX, 0.14);
          addDimension(group, v(x1 + 0.16, objectY0, z1 + 0.025), v(x1 + 0.16, objectY1, z1 + 0.025), vectorX, 0.12);
        }
        if (hasRecess) {
          const recessWidthDimensionSideX = sideView ? rx1 + 0.18 : recessWidthDimensionX;
          addDimension(group, v(rx0, recessDimensionY, recessLengthDimensionZ), v(rx1, recessDimensionY, recessLengthDimensionZ), vectorZ, 0.12);
          addDimension(group, v(recessWidthDimensionSideX, recessDimensionY, rz0), v(recessWidthDimensionSideX, recessDimensionY, rz1), vectorX, 0.12);
        }
      }

      function rebuild() {
        clearRoot();

        const dims = {
          width: state.width,
          height: state.height,
          depth: state.depth
        };
        if (state.layoutMode === "tabletop") {
          addTabletopScene(root, dims);
          render();
          return;
        }

        const hasRecess = state.showRecess === "true";
        const leftX = hasRecess ? -(state.gap / 2 + state.width / 2) : 0;
        const recessDims = getRecessDims(dims);
        const recessCenterX = state.gap / 2 + recessDims.width / 2;
        const recessOpening = hasRecess
          ? {
              x0: recessCenterX - recessDims.width / 2,
              x1: recessCenterX + recessDims.width / 2,
              y0: 0,
              y1: recessDims.height
            }
          : null;

        addWallAndFloor(root, recessOpening);
        addLeftBlock(root, leftX, dims);
        if (hasRecess) {
          addRightRecess(root, recessCenterX, recessDims);
        }
        render();
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(1, Math.round(rect.width));
        const height = Math.max(1, Math.round(rect.height));
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        render();
      }

      function render() {
        renderer.render(scene, camera);
        scheduleWorkspaceSave();
      }

      function syncStickerOverlay() {
        const hasSticker = Boolean(state.stickerSrc);
        stickerOverlay.classList.toggle("is-hidden", !hasSticker);
        if (!hasSticker) {
          stickerOverlay.removeAttribute("src");
          scheduleWorkspaceSave();
          return;
        }
        if (stickerOverlay.src !== state.stickerSrc) {
          stickerOverlay.src = state.stickerSrc;
        }
        stickerOverlay.style.left = `${state.stickerX * 100}%`;
        stickerOverlay.style.top = `${state.stickerY * 100}%`;
        stickerOverlay.style.width = `${state.stickerScale * 100}%`;
        scheduleWorkspaceSave();
      }

      function getSelectedTextItem() {
        return state.textItems.find((item) => item.id === selectedTextId) || null;
      }

      function syncTextControls() {
        const item = getSelectedTextItem();
        const editor = document.querySelector("#textEditor");
        const sizeRange = document.querySelector("#textFontSizeRange");
        const sizeNumber = document.querySelector("#textFontSizeNumber");
        editor.disabled = !item;
        sizeRange.disabled = !item;
        sizeNumber.disabled = !item;
        editor.value = item?.text || "";
        sizeRange.value = item?.fontSize || 32;
        sizeNumber.value = item?.fontSize || 32;
      }

      function syncTextOverlays() {
        textOverlayLayer.innerHTML = "";
        for (const item of state.textItems) {
          const element = document.createElement("div");
          element.className = `text-overlay${item.id === selectedTextId ? " is-selected" : ""}`;
          element.dataset.textId = item.id;
          element.textContent = item.text || " ";
          element.style.left = `${item.x * 100}%`;
          element.style.top = `${item.y * 100}%`;
          element.style.fontSize = `${item.fontSize}px`;
          textOverlayLayer.appendChild(element);
        }
        syncTextControls();
        scheduleWorkspaceSave();
      }

      function selectTextItem(id) {
        selectedTextId = state.textItems.some((item) => item.id === id) ? id : null;
        syncTextOverlays();
      }

      function syncControlVisibility() {
        document.querySelector("#showRecessField").classList.toggle("is-hidden", false);
        const showDimensionLayout = state.layoutMode === "wall" && state.showRecess !== "true";
        document.querySelector("#dimensionLayoutField").classList.toggle("is-hidden", !showDimensionLayout);
        const showGroundOutlineControls = state.layoutMode === "wall";
        const showGroundOutlineAdjustments = showGroundOutlineControls && state.showGroundOutline === "true";
        document.querySelector("#groundOutlineField").classList.toggle("is-hidden", !showGroundOutlineControls);
        document.querySelector("#groundOutlineSizeField").classList.toggle("is-hidden", !showGroundOutlineAdjustments);
        document.querySelector("#groundOutlineXField").classList.toggle("is-hidden", !showGroundOutlineAdjustments);
        document.querySelector("#groundOutlineZField").classList.toggle("is-hidden", !showGroundOutlineAdjustments);
        document.querySelectorAll("[data-dimension-layout]").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.dimensionLayout === state.dimensionLayout);
        });
        document.querySelector("#cameraYawField").classList.toggle("is-hidden", false);
        document.querySelector("#cameraPitchField").classList.toggle("is-hidden", false);
      }

      function syncOutputRatio() {
        const ratioMap = {
          "3:2": { css: "3 / 2", value: 1.5 },
          "4:3": { css: "4 / 3", value: 4 / 3 },
          "16:9": { css: "16 / 9", value: 16 / 9 }
        };
        const ratio = ratioMap[state.outputRatio] || ratioMap["3:2"];
        document.documentElement.style.setProperty("--sheet-ratio", ratio.css);
        document.documentElement.style.setProperty("--sheet-ratio-value", String(ratio.value));
        document.querySelectorAll("[data-output-ratio]").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.outputRatio === state.outputRatio);
        });
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function roundControlValue(value) {
        return Math.round(value * 100) / 100;
      }

      function getControlRange(key) {
        const control = document.querySelector(`input[data-key="${key}"][type="number"]`);
        return {
          min: Number(control?.min ?? 0),
          max: Number(control?.max ?? Number.POSITIVE_INFINITY)
        };
      }

      function syncInputsForKey(key) {
        const inputs = document.querySelectorAll(`[data-key="${key}"]`);
        for (const input of inputs) {
          if (input.type === "checkbox") {
            input.checked = state[key] === "true";
          } else {
            input.value = state[key];
          }
        }
      }

      function setCameraControl(key, value) {
        const range = getControlRange(key);
        const nextValue = roundControlValue(clamp(value, range.min, range.max));
        if (state[key] === nextValue) return;
        state[key] = nextValue;
        syncInputsForKey(key);
        updateCamera();
        if ((state.layoutMode === "tabletop" && key === "cameraYaw") || (state.layoutMode === "wall" && key === "cameraPitch")) {
          rebuild();
        } else {
          render();
        }
      }

      function syncAspectRatioFromDimensions() {
        const { primary, secondary } = getAspectRatioKeys();
        if (state[secondary] <= 0) return;
        state.aspectRatio = roundControlValue(state[primary] / state[secondary]);
        syncInputsForKey("aspectRatio");
      }

      function getAspectRatioKeys() {
        return state.layoutMode === "tabletop" ? { primary: "width", secondary: "depth" } : { primary: "width", secondary: "height" };
      }

      function applyLockedAspectRatio(changedKey) {
        const ratio = Number(state.aspectRatio);
        if (!Number.isFinite(ratio) || ratio <= 0) return;
        const { primary, secondary } = getAspectRatioKeys();
        const primaryRange = getControlRange(primary);
        const secondaryRange = getControlRange(secondary);
        if (changedKey === secondary) {
          const nextPrimary = roundControlValue(clamp(state[secondary] * ratio, primaryRange.min, primaryRange.max));
          state[primary] = nextPrimary;
          state[secondary] = roundControlValue(clamp(nextPrimary / ratio, secondaryRange.min, secondaryRange.max));
        } else {
          const nextSecondary = roundControlValue(clamp(state[primary] / ratio, secondaryRange.min, secondaryRange.max));
          state[secondary] = nextSecondary;
          state[primary] = roundControlValue(clamp(nextSecondary * ratio, primaryRange.min, primaryRange.max));
        }
        syncInputsForKey(primary);
        syncInputsForKey(secondary);
      }

      function syncLayoutLabels() {
        const isTabletop = state.layoutMode === "tabletop";
        document.querySelector('label[for="widthRange"]').textContent = isTabletop ? "长" : "宽";
        document.querySelector('label[for="depthRange"]').textContent = isTabletop ? "宽" : "深";
        document.querySelector('label[for="aspectRatioNumber"]').textContent = isTabletop ? "长宽比" : "宽高比";
      }

      function syncDimensionFieldOrder() {
        const group = document.querySelector("#showRecessField").parentElement;
        const orderedIds = state.layoutMode === "tabletop"
          ? ["showRecessField", "dimensionLayoutField", "groundOutlineField", "groundOutlineSizeField", "groundOutlineXField", "groundOutlineZField", "dimensionSectionTitle", "aspectRatioField", "lockAspectRatioField", "widthField", "depthField", "heightField"]
          : ["showRecessField", "dimensionLayoutField", "groundOutlineField", "groundOutlineSizeField", "groundOutlineXField", "groundOutlineZField", "dimensionSectionTitle", "aspectRatioField", "lockAspectRatioField", "widthField", "heightField", "depthField"];
        for (const id of orderedIds) {
          group.appendChild(document.querySelector(`#${id}`));
        }
      }

      function syncLayoutControls() {
        const isTabletop = state.layoutMode === "tabletop";
        syncLayoutLabels();
        syncDimensionFieldOrder();
        const widthRange = {
          min: isTabletop ? "0.3" : "0.3",
          max: isTabletop ? "10.4" : "10.4",
          step: "0.01"
        };
        for (const input of [document.querySelector("#widthRange"), document.querySelector("#widthNumber")]) {
          input.min = widthRange.min;
          input.max = widthRange.max;
          input.step = widthRange.step;
        }
        const heightRange = {
          min: isTabletop ? "0.08" : "0.3",
          max: isTabletop ? "2.4" : "9.6",
          step: isTabletop ? "0.01" : "0.01"
        };
        for (const input of [document.querySelector("#heightRange"), document.querySelector("#heightNumber")]) {
          input.min = heightRange.min;
          input.max = heightRange.max;
          input.step = heightRange.step;
        }
        const depthRange = {
          min: isTabletop ? "0.3" : "0.45",
          max: isTabletop ? "6.4" : "2.7",
          step: "0.01"
        };
        for (const input of [document.querySelector("#depthRange"), document.querySelector("#depthNumber")]) {
          input.min = depthRange.min;
          input.max = depthRange.max;
          input.step = depthRange.step;
        }
        const distanceRange = {
          min: isTabletop ? "3.8" : "5.8",
          max: isTabletop ? "19" : "25",
          step: "0.01"
        };
        for (const input of [document.querySelector("#cameraDistanceRange"), document.querySelector("#cameraDistanceNumber")]) {
          input.min = distanceRange.min;
          input.max = distanceRange.max;
          input.step = distanceRange.step;
        }
        const fovRange = {
          min: "10",
          max: "60",
          step: "0.1"
        };
        for (const input of [document.querySelector("#cameraFovRange"), document.querySelector("#cameraFovNumber")]) {
          input.min = fovRange.min;
          input.max = fovRange.max;
          input.step = fovRange.step;
        }
        const yawRange = {
          min: isTabletop ? "-90" : "-36",
          max: isTabletop ? "90" : "36",
          step: "0.1"
        };
        for (const input of [document.querySelector("#cameraYawRange"), document.querySelector("#cameraYawNumber")]) {
          input.min = yawRange.min;
          input.max = yawRange.max;
          input.step = yawRange.step;
        }
        const pitchRange = {
          min: isTabletop ? "8" : "-36",
          max: isTabletop ? "72" : "48",
          step: "0.1"
        };
        for (const input of [document.querySelector("#cameraPitchRange"), document.querySelector("#cameraPitchNumber")]) {
          input.min = pitchRange.min;
          input.max = pitchRange.max;
          input.step = pitchRange.step;
        }
        const panXRange = {
          min: isTabletop ? "-5.6" : "-5.6",
          max: isTabletop ? "5.6" : "5.6",
          step: "0.01"
        };
        for (const input of [document.querySelector("#cameraPanXRange"), document.querySelector("#cameraPanXNumber")]) {
          input.min = panXRange.min;
          input.max = panXRange.max;
          input.step = panXRange.step;
        }
        const panYRange = {
          min: isTabletop ? "-5.6" : "-5.6",
          max: isTabletop ? "5.6" : "5.6",
          step: "0.01"
        };
        for (const input of [document.querySelector("#cameraPanYRange"), document.querySelector("#cameraPanYNumber")]) {
          input.min = panYRange.min;
          input.max = panYRange.max;
          input.step = panYRange.step;
        }
        const gapRange = {
          min: isTabletop ? "0.04" : "1.0",
          max: isTabletop ? "1.8" : "5.2",
          step: "0.01"
        };
        for (const input of [document.querySelector("#gapRange"), document.querySelector("#gapNumber")]) {
          input.min = gapRange.min;
          input.max = gapRange.max;
          input.step = gapRange.step;
        }
      }

      function applyLayoutPreset(layoutMode) {
        if (layoutMode === "tabletop") {
          if (state.height > 1.2) state.height = 0.28;
          if (state.width < 2.2) state.width = 2.6;
          if (state.depth < 1.05) state.depth = 1.1;
          if (state.gap > 0.9 || state.gap < 0.04) state.gap = 0.58;
          state.cameraDistance = 5.2;
          state.cameraYaw = 0;
          state.cameraPitch = 23;
          state.cameraPanX = 0;
          state.cameraPanY = -0.04;
        } else {
          if (state.height < 2.4) state.height = 3.45;
          if (state.gap < 1.0) state.gap = 1.82;
          state.cameraDistance = 8.88;
          state.cameraYaw = 0;
          state.cameraPitch = 0;
          state.cameraPanX = 0;
          state.cameraPanY = 0;
        }
      }

      function getRecessDims(dims) {
        const scaleMap = {
          larger: { width: 1.08, height: 1.06, depth: 1.08 },
          same: { width: 1, height: 1, depth: 1 },
          smaller: { width: 0.94, height: 0.96, depth: 0.94 }
        };
        const scale = scaleMap[state.recessFit] || scaleMap.same;
        return {
          width: dims.width * scale.width,
          height: dims.height * scale.height,
          depth: dims.depth * scale.depth
        };
      }

      function colorToHex(color) {
        return `#${color.toString(16).padStart(6, "0")}`.toUpperCase();
      }

      function parseHexColor(value) {
        const match = String(value).trim().match(/^#?([0-9a-f]{6})$/i);
        if (!match) return null;
        return Number.parseInt(match[1], 16);
      }

      function syncColorControls() {
        const controls = document.querySelectorAll("[data-color-key]");
        for (const control of controls) {
          const value = colorToHex(COLORS[control.dataset.colorKey]);
          control.value = value;
        }
      }

      function applyColor(key, value) {
        const parsed = parseHexColor(value);
        if (parsed === null || !(key in COLORS)) return;
        COLORS[key] = parsed;
        syncSceneColorMaterials();
        syncColorControls();
        rebuild();
      }

      function syncSceneColorMaterials() {
        lineMaterials.wall.color.setHex(COLORS.wallLine);
        lineMaterials.soft.color.setHex(COLORS.wallLineSoft);
        lineMaterials.edge.color.setHex(COLORS.objectEdge);
        lineMaterials.applianceDetail.color.setHex(COLORS.applianceDetail);
        lineMaterials.applianceGroove.color.setHex(COLORS.applianceGroove);
        lineMaterials.dimension.color.setHex(COLORS.dimension);
        for (const [sourceMaterial, strokeMaterial] of segmentStrokeMaterials) {
          strokeMaterial.color.copy(sourceMaterial.color);
          strokeMaterial.opacity = sourceMaterial.opacity;
          strokeMaterial.needsUpdate = true;
        }
      }

      function cloneState() {
        const copy = {};
        for (const key of variantKeys) {
          copy[key] = Array.isArray(state[key])
            ? state[key].map((item) => ({ ...item }))
            : state[key];
        }
        return copy;
      }

      function cloneVariants() {
        return variants.map((variant) => {
          if (!variant) return null;
          return {
            state: Object.fromEntries(
              Object.entries(variant.state).map(([key, value]) => [
                key,
                Array.isArray(value) ? value.map((item) => ({ ...item })) : value
              ])
            ),
            thumbnail: variant.thumbnail
          };
        });
      }

      function openWorkspaceDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(WORKSPACE_DB_NAME, 1);
          request.addEventListener("upgradeneeded", () => {
            const database = request.result;
            if (!database.objectStoreNames.contains(WORKSPACE_STORE_NAME)) {
              database.createObjectStore(WORKSPACE_STORE_NAME);
            }
          });
          request.addEventListener("success", () => resolve(request.result));
          request.addEventListener("error", () => reject(request.error));
        });
      }

      async function saveWorkspaceNow() {
        if (!persistenceReady) return;
        try {
          const database = await openWorkspaceDatabase();
          const transaction = database.transaction(WORKSPACE_STORE_NAME, "readwrite");
          transaction.objectStore(WORKSPACE_STORE_NAME).put(
            {
              state: cloneState(),
              variants: cloneVariants(),
              activeVariantIndex,
              colors: { ...COLORS }
            },
            WORKSPACE_RECORD_KEY
          );
          await new Promise((resolve, reject) => {
            transaction.addEventListener("complete", resolve);
            transaction.addEventListener("error", () => reject(transaction.error));
            transaction.addEventListener("abort", () => reject(transaction.error));
          });
          database.close();
        } catch (error) {
          console.warn("无法保存本地工作区", error);
        }
      }

      function scheduleWorkspaceSave() {
        if (!persistenceReady) return;
        window.clearTimeout(persistenceTimer);
        persistenceTimer = window.setTimeout(saveWorkspaceNow, 180);
      }

      async function restoreWorkspace() {
        try {
          const database = await openWorkspaceDatabase();
          const transaction = database.transaction(WORKSPACE_STORE_NAME, "readonly");
          const request = transaction.objectStore(WORKSPACE_STORE_NAME).get(WORKSPACE_RECORD_KEY);
          const saved = await new Promise((resolve, reject) => {
            request.addEventListener("success", () => resolve(request.result));
            request.addEventListener("error", () => reject(request.error));
          });
          database.close();
          if (!saved) return;

          if (saved.state) {
            for (const key of variantKeys) {
              if (!(key in saved.state)) continue;
              state[key] = Array.isArray(saved.state[key])
                ? saved.state[key].map((item) => ({ ...item }))
                : saved.state[key];
            }
          }
          if (Array.isArray(saved.variants)) {
            for (let index = 0; index < variants.length; index += 1) {
              const variant = saved.variants[index];
              variants[index] = variant
                ? {
                    state: Object.fromEntries(
                      Object.entries(variant.state || {}).map(([key, value]) => [
                        key,
                        Array.isArray(value) ? value.map((item) => ({ ...item })) : value
                      ])
                    ),
                    thumbnail: variant.thumbnail || ""
                  }
                : null;
            }
          }
          if (saved.colors) {
            for (const key of Object.keys(COLORS)) {
              if (Number.isFinite(saved.colors[key])) COLORS[key] = saved.colors[key];
            }
            syncSceneColorMaterials();
          }
          activeVariantIndex = clamp(Number(saved.activeVariantIndex) || 0, 0, variants.length - 1);
          selectedTextId = state.textItems[0]?.id || null;
        } catch (error) {
          console.warn("无法恢复本地工作区", error);
        }
      }

      function clearVariants() {
        variants.fill(null);
        activeVariantIndex = 0;
        renderVariantDock();
        scheduleWorkspaceSave();
      }

      async function saveVariant(index) {
        activeVariantIndex = index;
        await waitStickerReady();
        await waitTextFontReady();
        await waitFrame();
        render();
        variants[index] = {
          state: cloneState(),
          thumbnail: createCompositeCanvas().toDataURL("image/png")
        };
        renderVariantDock();
        scheduleWorkspaceSave();
      }

      function applyVariant(index) {
        const variant = variants[index];
        if (!variant) {
          activeVariantIndex = index;
          renderVariantDock();
          scheduleWorkspaceSave();
          return;
        }
        for (const key of variantKeys) {
          if (!(key in variant.state)) continue;
          state[key] = Array.isArray(variant.state[key])
            ? variant.state[key].map((item) => ({ ...item }))
            : variant.state[key];
        }
        selectedTextId = state.textItems[0]?.id || null;
        activeVariantIndex = index;
        syncOutputRatio();
        syncLayoutControls();
        syncInputsToState();
        syncControlVisibility();
        syncStickerOverlay();
        syncTextOverlays();
        updateCamera();
        resize();
        rebuild();
        renderVariantDock();
      }

      function syncInputsToState() {
        const inputs = document.querySelectorAll("input[data-key], select[data-key]");
        for (const input of inputs) {
          if (input.type === "checkbox") {
            input.checked = state[input.dataset.key] === "true";
          } else {
            input.value = state[input.dataset.key];
          }
        }
      }

      function waitFrame() {
        return new Promise((resolve) => requestAnimationFrame(() => resolve()));
      }

      function waitStickerReady() {
        if (!state.stickerSrc || (stickerOverlay.complete && stickerOverlay.naturalWidth > 0)) {
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          stickerOverlay.addEventListener("load", resolve, { once: true });
          stickerOverlay.addEventListener("error", resolve, { once: true });
        });
      }

      function waitTextFontReady() {
        if (!document.fonts?.load) return Promise.resolve();
        return document.fonts.load('36px "FZLanTingHeiS-R-GB", "方正兰亭黑简体"');
      }

      function createCompositeCanvas() {
        const output = document.createElement("canvas");
        output.width = canvas.width;
        output.height = canvas.height;
        const context = output.getContext("2d");
        context.drawImage(canvas, 0, 0);
        if (state.stickerSrc && stickerOverlay.complete && stickerOverlay.naturalWidth > 0) {
          const stickerWidth = output.width * state.stickerScale;
          const stickerHeight = stickerWidth * (stickerOverlay.naturalHeight / stickerOverlay.naturalWidth);
          const stickerLeft = output.width * state.stickerX - stickerWidth / 2;
          const stickerTop = output.height * state.stickerY - stickerHeight / 2;
          context.drawImage(stickerOverlay, stickerLeft, stickerTop, stickerWidth, stickerHeight);
        }
        const sheet = document.querySelector(".drawing-sheet");
        const previewWidth = Math.max(1, sheet.getBoundingClientRect().width);
        const exportScale = output.width / previewWidth;
        context.fillStyle = "#111111";
        context.textAlign = "center";
        context.textBaseline = "middle";
        for (const item of state.textItems) {
          const fontSize = item.fontSize * exportScale;
          const lineHeight = fontSize * 1.25;
          const lines = String(item.text || "").split("\n");
          const blockHeight = lineHeight * Math.max(1, lines.length);
          const centerX = output.width * item.x;
          const centerY = output.height * item.y;
          context.font = `${fontSize}px "FZLanTingHeiS-R-GB", "方正兰亭黑简体", sans-serif`;
          lines.forEach((line, index) => {
            const lineY = centerY - blockHeight / 2 + lineHeight * (index + 0.5);
            context.fillText(line, centerX, lineY);
          });
        }
        return output;
      }

      function renderVariantDock() {
        const dock = document.querySelector("#variantDock");
        dock.innerHTML = "";
        variants.forEach((variant, index) => {
          const card = document.createElement("button");
          card.className = `variant-card${index === activeVariantIndex ? " is-active" : ""}`;
          card.type = "button";
          card.title = variant ? `切换到方案 ${index + 1}` : `创建方案 ${index + 1}`;
          card.dataset.variantIndex = String(index);
          if (variant && variant.thumbnail) {
            const image = document.createElement("img");
            image.alt = `方案 ${index + 1} 预览`;
            image.src = variant.thumbnail;
            card.appendChild(image);
          } else {
            const empty = document.createElement("div");
            empty.className = "variant-empty";
            empty.textContent = "+";
            card.appendChild(empty);
          }
          const label = document.createElement("div");
          label.className = "variant-label";
          label.textContent = `方案 ${index + 1}`;
          card.appendChild(label);
          const saveButton = document.createElement("button");
          saveButton.className = "variant-save";
          saveButton.type = "button";
          saveButton.textContent = "保存";
          saveButton.addEventListener("click", (event) => {
            event.stopPropagation();
            saveVariant(index);
          });
          card.appendChild(saveButton);
          card.addEventListener("click", () => applyVariant(index));
          dock.appendChild(card);
        });
      }

      function downloadCanvas(filename) {
        return new Promise((resolve) => {
          createCompositeCanvas().toBlob((blob) => {
            if (!blob) {
              resolve();
              return;
            }
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => {
              URL.revokeObjectURL(url);
              resolve();
            }, 120);
          }, "image/png");
        });
      }

      async function exportVariant(index) {
        if (!variants[index]) return;
        const restoreIndex = activeVariantIndex;
        applyVariant(index);
        await waitStickerReady();
        await waitTextFontReady();
        await waitFrame();
        render();
        await downloadCanvas(`size-diagram-${String(index + 1).padStart(2, "0")}.png`);
        applyVariant(restoreIndex);
      }

      async function exportAllVariants() {
        const restoreIndex = activeVariantIndex;
        for (let i = 0; i < variants.length; i += 1) {
          if (!variants[i]) continue;
          applyVariant(i);
          await waitStickerReady();
          await waitTextFontReady();
          await waitFrame();
          render();
          await downloadCanvas(`size-diagram-${String(i + 1).padStart(2, "0")}.png`);
        }
        applyVariant(restoreIndex);
      }

      function bindControls() {
        const inputs = document.querySelectorAll("input[data-key], select[data-key]");
        for (const input of inputs) {
          if (input.type === "checkbox") {
            input.checked = state[input.dataset.key] === "true";
          } else {
            input.value = state[input.dataset.key];
          }
          const eventName = input.tagName === "SELECT" || input.type === "checkbox" || input.dataset.key === "aspectRatio" ? "change" : "input";
          input.addEventListener(eventName, () => {
            const key = input.dataset.key;
            const isNumeric = input.type === "range" || input.type === "number";
            let value = input.type === "checkbox" ? String(input.checked) : isNumeric ? Number(input.value) : input.value;
            if (isNumeric && !Number.isFinite(value)) return;
            if (key === "aspectRatio") {
              value = Number(String(value).trim().replace("，", "."));
              if (!Number.isFinite(value)) {
                syncInputsForKey("aspectRatio");
                return;
              }
              value = roundControlValue(clamp(value, 0.1, 8));
            }
            const previousValue = state[key];
            state[key] = value;
            if (key === "layoutMode" && previousValue !== value) {
              applyLayoutPreset(value);
              syncLayoutControls();
              if (state.lockAspectRatio === "true") {
                applyLockedAspectRatio("width");
              } else {
                syncAspectRatioFromDimensions();
              }
              syncInputsToState();
              clearVariants();
            } else if (key === "aspectRatio") {
              state.lockAspectRatio = "true";
              syncInputsForKey("lockAspectRatio");
              applyLockedAspectRatio("width");
              syncInputsForKey("aspectRatio");
            } else if (key === "lockAspectRatio") {
              if (value === "true") {
                syncAspectRatioFromDimensions();
              }
            } else if (Object.values(getAspectRatioKeys()).includes(key)) {
              state[key] = roundControlValue(state[key]);
              if (state.lockAspectRatio === "true") {
                applyLockedAspectRatio(key);
              } else {
                syncAspectRatioFromDimensions();
              }
            } else if (key === "outputRatio") {
              syncOutputRatio();
              resize();
            } else if (key === "stickerScale") {
              syncStickerOverlay();
            }
            syncControlVisibility();
            for (const peer of inputs) {
              if (peer === input || peer.dataset.key !== key) continue;
              if (peer.type === "checkbox") {
                peer.checked = state[key] === "true";
              } else {
                peer.value = state[key];
              }
            }
            if (key === "layoutMode") {
              updateCamera();
              rebuild();
            } else if (key === "stickerScale") {
              syncStickerOverlay();
              renderVariantDock();
            } else if (key === "cameraDistance" || key === "cameraFov" || key === "cameraYaw" || key === "cameraPitch" || key === "cameraPanX" || key === "cameraPanY") {
              updateCamera();
              if ((state.layoutMode === "tabletop" && key === "cameraYaw") || (state.layoutMode === "wall" && key === "cameraPitch")) {
                rebuild();
              } else {
                render();
              }
            } else {
              rebuild();
            }
          });
        }

        bindViewportCameraControls();
        bindStickerControls();
        bindTextControls();

        document.querySelector("#togglePanel").addEventListener("click", () => {
          document.querySelector("#panel").classList.toggle("collapsed");
        });

        document.querySelector("#exportCurrent").addEventListener("click", () => {
          exportVariant(activeVariantIndex);
        });

        document.querySelector("#exportAll").addEventListener("click", () => {
          exportAllVariants();
        });

        document.querySelectorAll("[data-output-ratio]").forEach((button) => {
          button.addEventListener("click", () => {
            state.outputRatio = button.dataset.outputRatio;
            syncOutputRatio();
            resize();
            renderVariantDock();
          });
        });

        document.querySelectorAll("[data-dimension-layout]").forEach((button) => {
          button.addEventListener("click", () => {
            state.dimensionLayout = button.dataset.dimensionLayout;
            syncControlVisibility();
            rebuild();
          });
        });

        document.querySelectorAll("[data-color-key]").forEach((input) => {
          input.addEventListener("input", () => {
            applyColor(input.dataset.colorKey, input.value);
          });
          input.addEventListener("change", () => {
            applyColor(input.dataset.colorKey, input.value);
          });
        });
      }

      function bindViewportCameraControls() {
        const sheet = document.querySelector(".drawing-sheet");
        const dragState = {
          active: false,
          x: 0,
          y: 0
        };
        sheet.addEventListener("pointerdown", (event) => {
          if (event.target === stickerOverlay || event.target.closest(".text-overlay")) return;
          if (event.button !== 0) return;
          dragState.active = true;
          dragState.x = event.clientX;
          dragState.y = event.clientY;
          sheet.classList.add("is-dragging");
          sheet.setPointerCapture(event.pointerId);
        });
        sheet.addEventListener("pointermove", (event) => {
          if (!dragState.active) return;
          const dx = event.clientX - dragState.x;
          const dy = event.clientY - dragState.y;
          dragState.x = event.clientX;
          dragState.y = event.clientY;
          const yawDelta = dx * 0.08;
          setCameraControl("cameraYaw", state.cameraYaw + (state.layoutMode === "tabletop" ? -yawDelta : yawDelta));
          setCameraControl("cameraPitch", state.cameraPitch + dy * 0.08);
        });
        const endDrag = (event) => {
          if (!dragState.active) return;
          dragState.active = false;
          sheet.classList.remove("is-dragging");
          if (sheet.hasPointerCapture(event.pointerId)) {
            sheet.releasePointerCapture(event.pointerId);
          }
        };
        sheet.addEventListener("pointerup", endDrag);
        sheet.addEventListener("pointercancel", endDrag);
        sheet.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            setCameraControl("cameraDistance", state.cameraDistance + event.deltaY * 0.006);
          },
          { passive: false }
        );
      }

      function bindStickerControls() {
        const sheet = document.querySelector(".drawing-sheet");
        const upload = document.querySelector("#stickerUpload");
        upload.addEventListener("change", () => {
          const file = upload.files?.[0];
          if (!file) return;
          if (file.type !== "image/png") {
            upload.value = "";
            return;
          }
          const reader = new FileReader();
          reader.addEventListener("load", () => {
            state.stickerSrc = String(reader.result || "");
            state.stickerX = 0.5;
            state.stickerY = 0.15;
            syncStickerOverlay();
          });
          reader.readAsDataURL(file);
        });

        document.querySelector("#centerSticker").addEventListener("click", () => {
          state.stickerX = 0.5;
          state.stickerY = 0.15;
          syncStickerOverlay();
        });

        document.querySelector("#removeSticker").addEventListener("click", () => {
          state.stickerSrc = "";
          upload.value = "";
          syncStickerOverlay();
        });

        const drag = { active: false, pointerId: null };
        stickerOverlay.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          event.stopPropagation();
          drag.active = true;
          drag.pointerId = event.pointerId;
          stickerOverlay.setPointerCapture(event.pointerId);
        });
        stickerOverlay.addEventListener("pointermove", (event) => {
          if (!drag.active || event.pointerId !== drag.pointerId) return;
          event.stopPropagation();
          const rect = sheet.getBoundingClientRect();
          state.stickerX = clamp((event.clientX - rect.left) / rect.width, 0, 1);
          state.stickerY = clamp((event.clientY - rect.top) / rect.height, 0, 1);
          syncStickerOverlay();
        });
        const endStickerDrag = (event) => {
          if (!drag.active || event.pointerId !== drag.pointerId) return;
          event.stopPropagation();
          drag.active = false;
          if (stickerOverlay.hasPointerCapture(event.pointerId)) {
            stickerOverlay.releasePointerCapture(event.pointerId);
          }
        };
        stickerOverlay.addEventListener("pointerup", endStickerDrag);
        stickerOverlay.addEventListener("pointercancel", endStickerDrag);
      }

      function bindTextControls() {
        const sheet = document.querySelector(".drawing-sheet");
        const editor = document.querySelector("#textEditor");
        const sizeRange = document.querySelector("#textFontSizeRange");
        const sizeNumber = document.querySelector("#textFontSizeNumber");

        document.querySelector("#addTextItem").addEventListener("click", () => {
          textItemSequence += 1;
          const offset = (state.textItems.length % 5) * 0.04;
          const item = {
            id: `text-${Date.now().toString(36)}-${textItemSequence}`,
            text: "请输入文字",
            x: 0.5 + offset,
            y: 0.2 + offset,
          fontSize: 32
          };
          state.textItems.push(item);
          selectedTextId = item.id;
          syncTextOverlays();
          editor.focus();
          editor.select();
        });

        document.querySelector("#removeTextItem").addEventListener("click", () => {
          if (!selectedTextId) return;
          state.textItems = state.textItems.filter((item) => item.id !== selectedTextId);
          selectedTextId = state.textItems[0]?.id || null;
          syncTextOverlays();
        });

        editor.addEventListener("input", () => {
          const item = getSelectedTextItem();
          if (!item) return;
          item.text = editor.value;
          const overlay = Array.from(textOverlayLayer.children).find((element) => element.dataset.textId === item.id);
          if (overlay) overlay.textContent = item.text || " ";
          scheduleWorkspaceSave();
        });

        const updateFontSize = (value) => {
          const item = getSelectedTextItem();
          if (!item) return;
          item.fontSize = clamp(Number(value) || 32, 12, 120);
          sizeRange.value = item.fontSize;
          sizeNumber.value = item.fontSize;
          const overlay = Array.from(textOverlayLayer.children).find((element) => element.dataset.textId === item.id);
          if (overlay) overlay.style.fontSize = `${item.fontSize}px`;
          scheduleWorkspaceSave();
        };
        sizeRange.addEventListener("input", () => updateFontSize(sizeRange.value));
        sizeNumber.addEventListener("input", () => updateFontSize(sizeNumber.value));

        const drag = { active: false, id: null, pointerId: null, element: null };
        textOverlayLayer.addEventListener("pointerdown", (event) => {
          const target = event.target.closest(".text-overlay");
          if (!target || event.button !== 0) return;
          event.stopPropagation();
          selectedTextId = target.dataset.textId;
          Array.from(textOverlayLayer.children).forEach((element) => {
            element.classList.toggle("is-selected", element.dataset.textId === selectedTextId);
          });
          syncTextControls();
          drag.active = true;
          drag.id = selectedTextId;
          drag.pointerId = event.pointerId;
          drag.element = target;
          target.setPointerCapture(event.pointerId);
        });
        textOverlayLayer.addEventListener("pointermove", (event) => {
          if (!drag.active || event.pointerId !== drag.pointerId) return;
          event.stopPropagation();
          const item = state.textItems.find((entry) => entry.id === drag.id);
          if (!item) return;
          const rect = sheet.getBoundingClientRect();
          item.x = clamp((event.clientX - rect.left) / rect.width, 0, 1);
          item.y = clamp((event.clientY - rect.top) / rect.height, 0, 1);
          drag.element.style.left = `${item.x * 100}%`;
          drag.element.style.top = `${item.y * 100}%`;
        });
        const endTextDrag = (event) => {
          if (!drag.active || event.pointerId !== drag.pointerId) return;
          event.stopPropagation();
          if (drag.element?.hasPointerCapture(event.pointerId)) {
            drag.element.releasePointerCapture(event.pointerId);
          }
          drag.active = false;
          drag.id = null;
          drag.element = null;
          scheduleWorkspaceSave();
        };
        textOverlayLayer.addEventListener("pointerup", endTextDrag);
        textOverlayLayer.addEventListener("pointercancel", endTextDrag);
        textOverlayLayer.addEventListener("dblclick", (event) => {
          const target = event.target.closest(".text-overlay");
          if (!target) return;
          selectTextItem(target.dataset.textId);
          editor.focus();
          editor.select();
        });
      }

      async function initializeApp() {
        await restoreWorkspace();
        bindControls();
        syncColorControls();
        syncOutputRatio();
        syncLayoutControls();
        syncControlVisibility();
        syncStickerOverlay();
        syncTextOverlays();
        renderVariantDock();
        updateCamera();
        resize();
        rebuild();
        persistenceReady = true;
        scheduleWorkspaceSave();

        window.perspectiveBlocks = {
          state,
          rebuild,
          updateCamera,
          textureCache,
          colors: COLORS,
          saveWorkspace: saveWorkspaceNow
        };
      }

      window.addEventListener("resize", resize);
      window.addEventListener("pagehide", () => {
        window.clearTimeout(persistenceTimer);
        saveWorkspaceNow();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          window.clearTimeout(persistenceTimer);
          saveWorkspaceNow();
        }
      });
      initializeApp();
    </script>
  </body>
</html>
